version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: codeguardian-db
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian_secret_password
      POSTGRES_DB: codeguardian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d codeguardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeguardian-backend
    environment:
      - DATABASE_URL=postgresql://guardian:guardian_secret_password@db:5432/codeguardian
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ENABLE_GITHUB_COMMENTS=false
      - OWASP_VERSION=2025
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeguardian-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
